# ============================================================
# Production PostgreSQL Stack for Prisma
#   - postgres       (primary DB)
#   - pgbouncer      (connection pooler, port 6432)
#   - backup         (daily pg_dump + rotation)
#   - postgres_exporter (metrics for Prometheus/Grafana)
#   - prometheus     (optional, comment out if external)
# ============================================================

networks:
  pg_private_net:
    driver: bridge
    name: ${NETWORK_NAME:-pg_private_net}

volumes:
  pg_data:
    driver: local
  pg_wal_archive:
    driver: local
  pg_backups:
    driver: local
  prometheus_data:
    driver: local

services:

  # -----------------------------------------------------------
  # PostgreSQL Primary
  # -----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pg_data:/var/lib/postgresql/data
      - pg_wal_archive:/var/lib/postgresql/wal_archive
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./init:/docker-entrypoint-initdb.d:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - pg_private_net
    # Порт 5432 НЕ публікується зовні — тільки всередині Docker-мережі.
    # Для DIRECT_URL (Prisma migrate) підключайся через VPN + SSH тунель:
    #   ssh -L 5432:localhost:5432 user@your-server
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "1.5G"
        reservations:
          memory: "512M"

  # -----------------------------------------------------------
  # PgBouncer — Connection Pooler
  # Prisma DATABASE_URL → host:6432 (transaction pooling)
  # -----------------------------------------------------------
  pgbouncer:
    # bitnami/pgbouncer:latest часто відсутній на Docker Hub; legacy-образ з закріпленим тегом.
    image: bitnamilegacy/pgbouncer:1.22.1-debian-12-r9
    container_name: pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGBOUNCER_DATABASE: "*"
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: ${POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      PGBOUNCER_PORT: ${PGBOUNCER_LISTEN_PORT:-6432}
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 500
      PGBOUNCER_DEFAULT_POOL_SIZE: 20
      PGBOUNCER_AUTH_TYPE: scram-sha-256
      PGBOUNCER_AUTH_USER: ${POSTGRES_USER}
    volumes:
      - ./pgbouncer/pgbouncer.ini:/bitnami/pgbouncer/conf/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/bitnami/pgbouncer/conf/userlist.txt:ro
    networks:
      - pg_private_net
    ports:
      # Поки VPN не налаштований: bind на конкретний public IP сервера.
      # ОБОВ'ЯЗКОВО закрий доступ firewall allowlist-ом.
      - "91.239.232.91:6432:6432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"

  # -----------------------------------------------------------
  # Backup — щоденний pg_dump + ротація
  # -----------------------------------------------------------
  backup:
    image: postgres:16-alpine
    container_name: pg_backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DEST_PATH: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - pg_backups:/backups
      - ./backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ./backup/restore.sh:/usr/local/bin/restore.sh:ro
    networks:
      - pg_private_net
    # Запускаємо backup за розкладом через crond (Alpine cron)
    entrypoint: >
      sh -c "
        chmod +x /usr/local/bin/backup.sh /usr/local/bin/restore.sh &&
        echo '0 3 * * * /usr/local/bin/backup.sh >> /backups/backup.log 2>&1' | crontab - &&
        crond -f -l 6
      "
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"

  # -----------------------------------------------------------
  # postgres_exporter — метрики для Prometheus
  # -----------------------------------------------------------
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres_exporter
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/postgres?sslmode=disable"
    networks:
      - pg_private_net
    expose:
      - "9187"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "128M"

  # -----------------------------------------------------------
  # Prometheus (опційно — видали якщо є зовнішній)
  # -----------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - pg_private_net
    ports:
      # Тільки локально або через VPN
      - "127.0.0.1:9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"

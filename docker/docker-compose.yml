# ============================================================
# PostgreSQL Production Stack
#   - postgres          (primary DB)
#   - pgbouncer         (connection pooler, port 6432)
#   - backup            (daily pg_dump + rotation)
#   - postgres_exporter (metrics for Prometheus/Grafana)
#   - prometheus        (optional — comment out if external)
# ============================================================

networks:
  pg_private_net:
    driver: bridge
    name: ${NETWORK_NAME:-pg_private_net}

volumes:
  pg_data:
    driver: local
  pg_wal_archive:
    driver: local
  pg_backups:
    driver: local
  prometheus_data:
    driver: local

services:

  # -----------------------------------------------------------
  # PostgreSQL Primary
  # -----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    mem_limit: 768m
    mem_reservation: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pg_data:/var/lib/postgresql/data
      - pg_wal_archive:/var/lib/postgresql/wal_archive
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./init:/docker-entrypoint-initdb.d:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - pg_private_net
    # Port 5432 is NOT published externally — internal Docker network only.
    # Use an SSH tunnel or VPN for DIRECT_URL / admin access:
    #   ssh -L 5432:localhost:5432 user@your-server
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # -----------------------------------------------------------
  # PgBouncer — Connection Pooler
  # Clients connect to host:6432 (transaction pooling mode)
  # -----------------------------------------------------------
  pgbouncer:
    # bitnami/pgbouncer:latest is often unavailable on Docker Hub; pinned legacy tag.
    image: bitnamilegacy/pgbouncer:1.22.1-debian-12-r9
    container_name: pgbouncer
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGBOUNCER_DATABASE: "*"
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: ${POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      PGBOUNCER_PORT: ${PGBOUNCER_LISTEN_PORT:-6432}
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 500
      PGBOUNCER_DEFAULT_POOL_SIZE: 20
      PGBOUNCER_AUTH_TYPE: scram-sha-256
      PGBOUNCER_AUTH_USER: ${POSTGRES_USER}
    volumes:
      - ./pgbouncer/pgbouncer.ini:/bitnami/pgbouncer/conf/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/bitnami/pgbouncer/conf/userlist.txt:ro
    networks:
      - pg_private_net
    ports:
      # Public IP — restrict with firewall allowlist.
      # Change SERVER_PUBLIC_IP in .env or replace with 0.0.0.0 (with firewall).
      - "${SERVER_PUBLIC_IP:-0.0.0.0}:${PGBOUNCER_LISTEN_PORT:-6432}:6432"
      # Localhost bind for on-host diagnostics and MCP server.
      - "127.0.0.1:${PGBOUNCER_LISTEN_PORT:-6432}:6432"
    healthcheck:
      # PgBouncer does not respond correctly to pg_isready — TCP port check instead.
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/${PGBOUNCER_LISTEN_PORT:-6432}'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------
  # Backup — daily pg_dump + rotation
  # -----------------------------------------------------------
  backup:
    image: postgres:16-alpine
    container_name: pg_backup
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      postgres:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MAINTENANCE_DB: ${POSTGRES_MAINTENANCE_DB:-postgres}
      BACKUP_DEST_PATH: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - pg_backups:/backups
      - ./backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ./backup/restore.sh:/usr/local/bin/restore.sh:ro
    networks:
      - pg_private_net
    # Cron calls scripts via sh — bind-mounted files often lack +x bit.
    entrypoint: >
      sh -c "
        echo '0 3 * * * sh /usr/local/bin/backup.sh >> /backups/backup.log 2>&1' | crontab - &&
        crond -f -l 6
      "

  # -----------------------------------------------------------
  # postgres_exporter — metrics for Prometheus
  # -----------------------------------------------------------
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres_exporter
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      postgres:
        condition: service_started
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable"
    networks:
      - pg_private_net
    expose:
      - "9187"

  # -----------------------------------------------------------
  # Prometheus (optional — comment out if using external instance)
  # -----------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - pg_private_net
    ports:
      # Localhost or VPN only — do NOT expose publicly.
      - "127.0.0.1:9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"

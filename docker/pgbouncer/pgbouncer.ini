[databases]
app1 = host=postgres port=5432 dbname=app1 user=app1_user
app2 = host=postgres port=5432 dbname=app2 user=app2_user

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 500
default_pool_size = 20
admin_users = pgadmin
stats_users = pgadmin

[databases]
; Add project databases below using provision-db.sh or the MCP create_database tool.
; Format: <client_db_name> = host=postgres port=5432 dbname=<pg_db_name> user=<pg_user>
;
; The 'postgres' entry below is required for admin/maintenance access.
; It is added automatically by install.sh / reinstall.sh / server-update.sh.
; postgres = host=postgres port=5432 dbname=postgres user=<POSTGRES_USER>

[pgbouncer]
; --- Network ---
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =

; --- Auth ---
; plaintext passwords in userlist.txt — required for SCRAM passthrough
auth_type = plain
auth_file = /bitnami/pgbouncer/conf/userlist.txt

; --- Pooling ---
; transaction mode is optimal for web apps (Prisma, Drizzle, etc.)
pool_mode = transaction
max_client_conn = 500
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

; --- Timeouts ---
server_connect_timeout = 15
server_login_retry = 15
client_idle_timeout = 60
server_idle_timeout = 600
query_timeout = 0
query_wait_timeout = 30

; --- Logging ---
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

; --- Admin (set by install/reinstall/server-update scripts) ---
admin_users = pgadmin
stats_users = pgadmin

; --- TLS (enable if Postgres uses SSL) ---
; server_tls_sslmode = require
; server_tls_ca_file = /etc/ssl/certs/ca.crt

[databases]
; Формат: <dbname> = host=<postgres_host> port=5432 dbname=<dbname> user=<user>
; Один рядок на проєкт. Назва зліва — та, що в DATABASE_URL.
app1 = host=postgres port=5432 dbname=app1 user=app1_user
app2 = host=postgres port=5432 dbname=app2 user=app2_user

[pgbouncer]
; --- Network ---
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =

; --- Auth ---
auth_type = scram-sha-256
auth_file = /bitnami/pgbouncer/conf/userlist.txt

; --- Pooling ---
; transaction pooling — optimal for Prisma (відкриває/закриває конекти часто)
pool_mode = transaction
max_client_conn = 500
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

; --- Timeouts ---
server_connect_timeout = 15
server_login_retry = 15
client_idle_timeout = 60
server_idle_timeout = 600
query_timeout = 0
query_wait_timeout = 30

; --- Logging ---
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

; --- Admin ---
admin_users = pgadmin
stats_users = pgadmin

; --- TLS (вмикай якщо Postgres з SSL) ---
; server_tls_sslmode = require
; server_tls_ca_file = /etc/ssl/certs/ca.crt

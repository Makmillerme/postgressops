# ============================================================
# PostgreSQL — Production Tuning for Prisma + PgBouncer
# ============================================================
# Adjust shared_buffers / work_mem / max_connections to your RAM.
# Baseline below: shared 2 GB VPS (Postgres + other apps on same host).

# --- Network (обов’язково для Docker: інакше тільки localhost, з pgbouncer/backup не підключитися)
listen_addresses = '*'
port = 5432

# --- Connections ---
max_connections = 50                 # PgBouncer handles pooling; keep low on shared VPS
superuser_reserved_connections = 3

# --- Memory ---
shared_buffers = 256MB               # conservative for shared 2 GB host
work_mem = 4MB                       # per sort/hash; N connections * this
maintenance_work_mem = 64MB
effective_cache_size = 768MB         # planner hint; OS + PG cache estimate

# --- WAL & Durability ---
wal_level = replica                  # enables WAL archiving (PITR)
max_wal_senders = 3
wal_keep_size = 256MB
archive_mode = on
archive_command = 'cp %p /var/lib/postgresql/wal_archive/%f'

# --- Checkpoints ---
checkpoint_completion_target = 0.9
wal_buffers = 16MB
min_wal_size = 256MB
max_wal_size = 1GB

# --- Planner ---
random_page_cost = 1.1               # SSD-based storage
effective_io_concurrency = 200       # SSD; 2 for HDD

# --- Autovacuum ---
autovacuum = on
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.025
autovacuum_vacuum_cost_delay = 2ms

# --- Logging ---
log_destination = 'stderr'
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 1000    # log queries slower than 1s
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 10MB
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# --- Security ---
ssl = off                            # enable if using TLS termination at PG level
password_encryption = scram-sha-256

# --- Locale ---
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
